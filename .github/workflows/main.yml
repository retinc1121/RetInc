name: Build RoyalUDPRelay

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o RoyalUDPRelay.zip

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Gradle wrapper
        working-directory: RoyalUDPRelay
        run: gradle wrapper --gradle-version 8.10

      - name: Make gradlew executable
        working-directory: RoyalUDPRelay
        run: chmod +x ./gradlew

      - name: Build
        working-directory: RoyalUDPRelay
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: RoyalUDPRelay-jar
          path: RoyalUDPRelay/build/libs/*.jar
